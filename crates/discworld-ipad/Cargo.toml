[package]
name = "discworld-ipad"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
discworld-web = { path = "../discworld-web" }
serde_json = "1"

# Only the exported symbol attributes are locally allowed below. The shared
# runtime retains workspace forbid(unsafe_code); this bridge has no unsafe blocks.
[lints.rust]
unsafe_code = "deny"
