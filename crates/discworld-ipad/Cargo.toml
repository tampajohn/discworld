[package]
name = "discworld-ipad"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
discworld-web = { path = "../discworld-web", features = ["native-inspection"] }
serde_json = "1"
discworld-tools = { path = "../discworld-tools" }
discworld-core = { path = "../discworld-core" }
discworld-audio = { path = "../discworld-audio" }

# Only the exported symbol attributes are locally allowed below. The shared
# runtime retains workspace forbid(unsafe_code); this bridge has no unsafe blocks.
[lints.rust]
unsafe_code = "deny"
