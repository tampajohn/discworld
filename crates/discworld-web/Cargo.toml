[package]
name = "discworld-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
native-inspection = []
replay-validation = ["dep:discworld-replay"]

[dependencies]
discworld-replay = { path = "../discworld-replay", optional = true }
discworld-core = { path = "../discworld-core" }
discworld-audio = { path = "../discworld-audio" }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[lints]
workspace = true

[dev-dependencies]
sha2 = "=0.10.9"
