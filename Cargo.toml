[workspace]
members = ["crates/discworld-core", "crates/discworld-tools", "crates/discworld-audio", "crates/discworld-native", "crates/discworld-web"]
exclude = ["vendor/rustysynth"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"
